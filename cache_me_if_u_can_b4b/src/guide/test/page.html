<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citizen Services Portal (Practice)</title><style>body{font:20px sans-serif;color:#203830;background:#f5f7f4;margin:0;padding:20px;padding-bottom:55vh}header{padding:18px;background:#e6f4d8;font-weight:bold}main{max-width:680px;margin:auto}label{display:block;margin-block:22px}input,textarea,select,button{font:inherit;min-height:56px;box-sizing:border-box;max-width:100%;width:100%;padding:12px}input[type=checkbox]{width:56px;vertical-align:middle}button{background:#186458;color:white;border:0}.required{color:#a32d25;font-size:18px}#status{padding:16px;background:#fff3cf}input:focus,select:focus,textarea:focus{outline:3px solid #186458}</style></head><body><main><header>Practice page. Nothing here is real.</header><h1>Citizen Services Portal (Practice)</h1><p>Use fictional information only. Nothing is sent.</p><form novalidate><label>Full name <span class="required">*</span><input name="full_name" type="text" required ></label><label>Father's name <span class="required">*</span><input name="father_name" type="text" required ></label><label>Date of birth <span class="required">*</span><input name="dob" type="text" required placeholder="DD/MM/YYYY"></label><label>ID number <span class="required">*</span><input name="id_number" type="text" required ></label><label>Phone <span class="required">*</span><input name="phone" type="tel" required ></label><label>Email <span class="required">*</span><input name="email" type="email" required ></label><label>Address<textarea name="address" required></textarea></label><label>City <span class="required">*</span><select name="city" required><option value="">Choose</option><option>Practice City</option></select></label><label>Domicile <span class="required">*</span><input name="domicile" type="text" required ></label><label>Photo <span class="required">*</span><input name="photo" type="file" required accept="image/*"></label><label>Password <span class="required">*</span><input name="password" type="password" required ></label><label>Verification code <span class="required">*</span><input name="verification" type="text" required autocomplete="one-time-code"></label><label><input type="checkbox" name="terms" required> I have read the practice terms <span class="required">*</span></label><p id="phone-error" role="status"></p><button type="submit">Submit practice form</button></form><p id="status" role="status">Practice session</p></main><script>window.ReactNativeWebView={postMessage:function(raw){console.log("Guide message",JSON.parse(raw));}};</script><script>(function(){var form=document.querySelector('form');var phone=form.querySelector('input[type=tel]');phone.addEventListener('blur',function(){document.getElementById('phone-error').textContent=/^03[0-9]{9}$/.test(phone.value)?'':'Invalid input';});form.addEventListener('submit',function(e){e.preventDefault();document.getElementById('status').textContent='Practice complete. Nothing was sent.';});setTimeout(function(){document.getElementById('status').textContent='Session will expire';},40000);setTimeout(function(){document.getElementById('status').textContent='Session expired';},60000);})();</script></body></html>
